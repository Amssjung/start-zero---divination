    - data:
        code: "import json\nimport re\nfrom datetime import date, timedelta\n\nGAN\
          \ = \"甲乙丙丁戊己庚辛壬癸\"\nZHI = \"子丑寅卯辰巳午未申酉戌亥\"\nSHENGXIAO = \"鼠牛虎兔龙蛇马羊猴鸡狗猪\"\
          \nJIANCHU = [\"建\", \"除\", \"满\", \"平\", \"定\", \"执\", \"破\", \"危\", \"\
          成\", \"收\", \"开\", \"闭\"]\nWEEK = \"一二三四五六日\"\n\nYI = {\n    \"建\": \"出行、上任、会友\"\
          , \"除\": \"除旧、疗病、扫舍\",\n    \"满\": \"祭祀、祈福、开市\", \"平\": \"修造、平治道涂\",\n \
          \   \"定\": \"嫁娶、订盟、安床\", \"执\": \"捕捉、纳畜、修造\",\n    \"破\": \"破屋坏垣、求医\", \"\
          危\": \"安床、祭祀、祈福\",\n    \"成\": \"嫁娶、开市、入学、入宅\", \"收\": \"纳财、捕捉、进人口\",\n\
          \    \"开\": \"开市、出行、嫁娶、入学\", \"闭\": \"筑堤、埋葬、纳财\",\n}\nJI = {\n    \"建\"\
          : \"动土、开仓、掘井\", \"除\": \"嫁娶、出行\",\n    \"满\": \"服药、栽种\", \"平\": \"开渠、栽种\"\
          ,\n    \"定\": \"诉讼、出行\", \"执\": \"开市、出行\",\n    \"破\": \"嫁娶、开市、出行\", \"\
          危\": \"登高、行船\",\n    \"成\": \"诉讼\", \"收\": \"开市、出行\",\n    \"开\": \"安葬、动土\"\
          , \"闭\": \"开市、出行、求医\",\n}\nTERM = {1: 6, 2: 4, 3: 6, 4: 5, 5: 6, 6: 6,\n\
          \        7: 7, 8: 8, 9: 8, 10: 8, 11: 7, 12: 7}\nDAY_OFFSET = 49\n\n\ndef\
          \ parse_target(q):\n    t = str(q or \"\")\n    today = date.today()\n \
          \   if \"大后天\" in t:\n        return today + timedelta(days=3), False\n\
          \    if \"后天\" in t:\n        return today + timedelta(days=2), False\n\
          \    if \"明天\" in t or \"明日\" in t:\n        return today + timedelta(days=1),\
          \ False\n    if \"昨天\" in t:\n        return today - timedelta(days=1),\
          \ True\n\n    m = re.search(r\"(\\d{4})\\D{1,2}(\\d{1,2})\\D{1,2}(\\d{1,2})\"\
          , t)\n    if m:\n        try:\n            return date(int(m.group(1)),\
          \ int(m.group(2)), int(m.group(3))), False\n        except Exception:\n\
          \            pass\n\n    m = re.search(r\"(\\d{1,2})\\s*月\\s*(\\d{1,2})\"\
          , t)\n    if m:\n        try:\n            return date(today.year, int(m.group(1)),\
          \ int(m.group(2))), False\n        except Exception:\n            pass\n\
          \n    return today, False\n\n\ndef main(query: str, topic: str = \"\") ->\
          \ dict:\n    topic = str(topic or \"\").strip()\n    if topic not in (\"\
          marriage\", \"matter\", \"fortune\", \"growth\", \"choice\"):\n        topic\
          \ = \"\"\n\n    target, guessed = parse_target(query)\n    y, mo, d = target.year,\
          \ target.month, target.day\n\n    a = (14 - mo) // 12\n    y2 = y + 4800\
          \ - a\n    m2 = mo + 12 * a - 3\n    jdn = d + (153 * m2 + 2) // 5 + 365\
          \ * y2 + y2 // 4 - y2 // 100 + y2 // 400 - 32045\n    dg = (jdn + DAY_OFFSET)\
          \ % 10\n    dz = (jdn + DAY_OFFSET) % 12\n\n    mz = mo % 12\n    if d <\
          \ TERM.get(mo, 6):\n        mz = (mo - 1) % 12\n\n    name = JIANCHU[(dz\
          \ - mz) % 12]\n    chong_zhi = (dz + 6) % 12\n\n    board = {\n        \"\
          method\": \"almanac\",\n        \"topic\": topic,\n        \"date\": \"\
          %04d-%02d-%02d\" % (y, mo, d),\n        \"weekday\": \"星期\" + WEEK[target.weekday()],\n\
          \        \"day_ganzhi\": GAN[dg] + ZHI[dz],\n        \"jianchu\": name,\n\
          \        \"yi\": YI[name].split(\"、\"),\n        \"ji\": JI[name].split(\"\
          、\"),\n        \"chong\": SHENGXIAO[chong_zhi],\n        \"precision\":\
          \ \"simplified\",\n    }\n\n    lines = [\n        \"【日期】%s %s\" % (board[\"\
          date\"], board[\"weekday\"]),\n        \"【日柱】%s\" % board[\"day_ganzhi\"\
          ],\n        \"【建除】%s日\" % name,\n        \"【宜】%s\" % YI[name],\n       \
          \ \"【忌】%s\" % JI[name],\n        \"【冲】冲%s\" % SHENGXIAO[chong_zhi],\n  \
          \      \"（简化黄历，未含农历、节气交接与神煞）\",\n    ]\n\n    return {\n        \"board\"\
          : json.dumps(board, ensure_ascii=False),\n        \"board_text\": \"\\n\"\
          .join(lines),\n    }"
        code_language: python3
