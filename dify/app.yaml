    - data:
        code: "import json\nimport re\n\n\ndef parse_date(s):\n    t = str(s or \"\
          \").strip()\n    m = re.search(r\"(\\d{2,4})\\D+(\\d{1,2})\\D+(\\d{1,2})\"\
          , t)\n    if not m:\n        return None\n    y, mo, d = int(m.group(1)),\
          \ int(m.group(2)), int(m.group(3))\n    if y < 100:\n        y += 2000 if\
          \ y <= 30 else 1900\n    if not (1900 <= y <= 2100 and 1 <= mo <= 12 and\
          \ 1 <= d <= 31):\n        return None\n    return y, mo, d\n\n\ndef parse_time(s):\n\
          \    t = str(s or \"\").strip()\n    if not t:\n        return None\n\n\
          \    m = re.search(r\"(\\d{1,2})\\s*[:：]\\s*(\\d{1,2})\", t)\n    if m:\n\
          \        h, mi = int(m.group(1)), int(m.group(2))\n        if 0 <= h <=\
          \ 23 and 0 <= mi <= 59:\n            return h, mi\n\n    SHICHEN = {\"子\"\
          : 23, \"丑\": 1, \"寅\": 3, \"卯\": 5, \"辰\": 7, \"巳\": 9,\n              \
          \ \"午\": 11, \"未\": 13, \"申\": 15, \"酉\": 17, \"戌\": 19, \"亥\": 21}\n  \
          \  for k, v in SHICHEN.items():\n        if k + \"时\" in t:\n          \
          \  return v, 0\n\n    m = re.search(r\"(\\d{1,2})\\s*[点時时]\", t)\n    if\
          \ m:\n        h = int(m.group(1))\n        if any(w in t for w in (\"下午\"\
          , \"晚上\", \"傍晚\")) and h < 12:\n            h += 12\n        if \"中午\" in\
          \ t and h < 6:\n            h += 12\n        if 0 <= h <= 23:\n        \
          \    return h, 0\n\n    return None\n\n\ndef main(birth_date: str, birth_time:\
          \ str = \"\", gender: str = \"\",\n         query: str = \"\", topic: str\
          \ = \"\",topic_old: str = \"\") -> dict:\n\n    GAN = \"甲乙丙丁戊己庚辛壬癸\"\n \
          \   ZHI = \"子丑寅卯辰巳午未申酉戌亥\"\n    GAN_WX = {\"甲\": \"木\", \"乙\": \"木\", \"\
          丙\": \"火\", \"丁\": \"火\", \"戊\": \"土\",\n              \"己\": \"土\", \"\
          庚\": \"金\", \"辛\": \"金\", \"壬\": \"水\", \"癸\": \"水\"}\n    ZHI_WX = {\"\
          子\": \"水\", \"丑\": \"土\", \"寅\": \"木\", \"卯\": \"木\", \"辰\": \"土\",\n  \
          \            \"巳\": \"火\", \"午\": \"火\", \"未\": \"土\", \"申\": \"金\", \"\
          酉\": \"金\",\n              \"戌\": \"土\", \"亥\": \"水\"}\n    TERM = {1: 6,\
          \ 2: 4, 3: 6, 4: 5, 5: 6, 6: 6,\n            7: 7, 8: 8, 9: 8, 10: 8, 11:\
          \ 7, 12: 7}\n    DAY_OFFSET = 49\n\n    topic = str(topic or \"\").strip()\
          \ or str(topic_old or \"\").strip()\n    if topic not in (\"marriage\",\
          \ \"matter\", \"fortune\"):\n        topic = \"\"\n\n    parsed = parse_date(birth_date)\n\
          \    if parsed is None:\n        return {\n            \"ok\": False,\n\
          \            \"hint\": \"我还需要你的出生日期（公历年月日），比如「1998年3月12日」。\",\n        \
          \    \"board\": \"\",\n            \"board_text\": \"\",\n        }\n\n\
          \    y, m, d = parsed\n\n    tm = parse_time(birth_time)\n    has_time =\
          \ tm is not None\n\n    yy = y if (m, d) >= (2, 4) else y - 1\n    yg =\
          \ (yy - 4) % 10\n    yz = (yy - 4) % 12\n\n    idx = m % 12\n    if d <\
          \ TERM.get(m, 6):\n        idx = (m - 1) % 12\n    morder = (idx - 2) %\
          \ 12\n    mg = ((yg * 2 + 2) % 10 + morder) % 10\n\n    a = (14 - m) //\
          \ 12\n    y2 = y + 4800 - a\n    m2 = m + 12 * a - 3\n    jdn = d + (153\
          \ * m2 + 2) // 5 + 365 * y2 + y2 // 4 - y2 // 100 + y2 // 400 - 32045\n\
          \    dg = (jdn + DAY_OFFSET) % 10\n    dz = (jdn + DAY_OFFSET) % 12\n\n\
          \    hg = hz = -1\n    if has_time:\n        hh = tm[0]\n        hz = ((hh\
          \ + 1) // 2) % 12\n        hg = ((dg * 2) % 10 + hz) % 10\n\n    sizhu =\
          \ {\n        \"year\": GAN[yg] + ZHI[yz],\n        \"month\": GAN[mg] +\
          \ ZHI[idx],\n        \"day\": GAN[dg] + ZHI[dz],\n        \"hour\": (GAN[hg]\
          \ + ZHI[hz]) if has_time else \"\",\n    }\n\n    wx = {\"金\": 0, \"木\"\
          : 0, \"水\": 0, \"火\": 0, \"土\": 0}\n    for g, z in ((yg, yz), (mg, idx),\
          \ (dg, dz)):\n        wx[GAN_WX[GAN[g]]] += 1\n        wx[ZHI_WX[ZHI[z]]]\
          \ += 1\n    if has_time:\n        wx[GAN_WX[GAN[hg]]] += 1\n        wx[ZHI_WX[ZHI[hz]]]\
          \ += 1\n\n    board = {\n        \"method\": \"bazi\",\n        \"topic\"\
          : topic,\n        \"question\": query or \"\",\n        \"birth\": {\"date\"\
          : \"%04d-%02d-%02d\" % (y, m, d),\n                  \"time\": (\"%02d:%02d\"\
          \ % tm) if has_time else \"\",\n                  \"gender\": str(gender\
          \ or \"\").strip().lower()},\n        \"sizhu\": sizhu,\n        \"day_master\"\
          : GAN[dg] + GAN_WX[GAN[dg]],\n        \"wuxing\": wx,\n        \"precision\"\
          : \"simplified\",\n    }\n\n    lines = [\"【四柱】\",\n             \"年柱 %s\
          \   月柱 %s   日柱 %s\" % (sizhu[\"year\"], sizhu[\"month\"], sizhu[\"day\"\
          ])]\n    if has_time:\n        lines.append(\"时柱 %s\" % sizhu[\"hour\"])\n\
          \    else:\n        lines.append(\"时柱 未知（未提供出生时刻）\")\n    lines.append(\"\
          【日主】%s\" % board[\"day_master\"])\n    lines.append(\"【五行】\" + \"  \".join(\"\
          %s%d\" % (k, v) for k, v in wx.items()))\n\n    hint = \"\"\n    if not\
          \ has_time:\n        hint = \"时柱缺失，解读只能到日柱。想更准的话，告诉我大概几点出生。\"\n\n    return\
          \ {\n        \"ok\": True,\n        \"hint\": hint,\n        \"board\":\
          \ json.dumps(board, ensure_ascii=False),\n        \"board_text\": \"\\n\"\
          .join(lines),\n    }"
        code_language: python3
