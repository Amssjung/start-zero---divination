          \     }\n\n    m = max(1, min(12, m))\n    d = max(1, min(30, d))\n    h\
          \ = max(0, min(11, h))\n\n    yg = (y - 4) % 10\n    yz = (y - 4) % 12\n\
          \n    ming = (2 + (m - 1) - h) % 12\n    shen = (2 + (m - 1) + h) % 12\n\
          \n    yin_gan = (yg * 2 + 2) % 10\n    ming_gan = (yin_gan + (ming - 2)\
          \ % 12) % 10\n\n    n = ganzhi_index(ming_gan, ming)\n    element = NAYIN[n\
          \ // 2]\n    ju = JU[element]\n\n    stars, zi_wei, tian_fu = place_major(ju,\
          \ d)\n\n    star_pos = {}\n    for pidx, names in stars.items():\n     \
          \   for nm in names:\n            star_pos[nm] = ZHI[pidx]\n\n    hua_stars\
          \ = SIHUA[GAN[yg]]\n    hualu, huaquan, huake, huaji = hua_stars\n    sihua\
          \ = []\n    for star, label in ((hualu, \"禄\"), (huaquan, \"权\"), (huake,\
          \ \"科\"), (huaji, \"忌\")):\n        pos = star_pos.get(star, \"未排\")\n \
          \       sihua.append({\"star\": star, \"hua\": label, \"branch\": pos})\n\
          \n    is_yang = yg % 2 == 0\n    male = str(gender or \"\").strip().lower()\
