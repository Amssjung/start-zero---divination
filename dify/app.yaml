    - data:
        code: "import json\nimport random\nimport time\n\nTRIGRAM = {\n    (1, 1,\
          \ 1): \"乾\", (1, 1, 0): \"兑\", (1, 0, 1): \"离\", (1, 0, 0): \"震\",\n   \
          \ (0, 1, 1): \"巽\", (0, 1, 0): \"坎\", (0, 0, 1): \"艮\", (0, 0, 0): \"坤\"\
          ,\n}\n\nORDER = [\"乾\", \"兑\", \"离\", \"震\", \"巽\", \"坎\", \"艮\", \"坤\"\
          ]\n\nNAMES = {\n    \"乾\": [\"乾\", \"履\", \"同人\", \"无妄\", \"姤\", \"讼\",\
          \ \"遁\", \"否\"],\n    \"兑\": [\"夬\", \"兑\", \"革\", \"随\", \"大过\", \"困\"\
          , \"咸\", \"萃\"],\n    \"离\": [\"大有\", \"睽\", \"离\", \"噬嗑\", \"鼎\", \"未济\"\
          , \"旅\", \"晋\"],\n    \"震\": [\"大壮\", \"归妹\", \"丰\", \"震\", \"恒\", \"解\"\
          , \"小过\", \"豫\"],\n    \"巽\": [\"小畜\", \"中孚\", \"家人\", \"益\", \"巽\", \"\
          涣\", \"渐\", \"观\"],\n    \"坎\": [\"需\", \"节\", \"既济\", \"屯\", \"井\", \"\
          坎\", \"蹇\", \"比\"],\n    \"艮\": [\"大畜\", \"损\", \"贲\", \"颐\", \"蛊\", \"\
          蒙\", \"艮\", \"剥\"],\n    \"坤\": [\"泰\", \"临\", \"明夷\", \"复\", \"升\", \"\
          师\", \"谦\", \"坤\"],\n}\n\nYAO = [\"初爻\", \"二爻\", \"三爻\", \"四爻\", \"五爻\"\
          , \"上爻\"]\n\n\ndef main(query: str, topic: str = \"\") -> dict:\n    topic\
          \ = str(topic or \"\").strip()\n    if topic not in (\"marriage\", \"matter\"\
          , \"fortune\"):\n        topic = \"\"\n\n    seed = int(time.time() * 1000)\n\
          \    rng = random.Random(seed)\n\n    tosses = []\n    for _ in range(6):\n\
          \        coins = [3 if rng.random() < 0.5 else 2 for _ in range(3)]\n  \
          \      tosses.append(sum(coins))\n\n    ben = [1 if t in (7, 9) else 0 for\
          \ t in tosses]\n    bian = [(1 - b) if t in (6, 9) else b for t, b in zip(tosses,\
          \ ben)]\n    dong = [i + 1 for i, t in enumerate(tosses) if t in (6, 9)]\n\
          \n    def gua(lines):\n        lower = TRIGRAM[tuple(lines[0:3])]\n    \
          \    upper = TRIGRAM[tuple(lines[3:6])]\n        return {\n            \"\
          name\": NAMES[upper][ORDER.index(lower)],\n            \"upper\": upper,\n\
          \            \"lower\": lower,\n            \"lines\": lines,\n        }\n\
          \n    ben_gua = gua(ben)\n    bian_gua = gua(bian)\n\n    board = {\n  \
          \      \"method\": \"liuyao\",\n        \"topic\": topic,\n        \"question\"\
          : query or \"\",\n        \"tosses\": tosses,\n        \"ben_gua\": ben_gua,\n\
          \        \"bian_gua\": bian_gua,\n        \"dong_yao\": dong,\n        \"\
          seed\": seed,\n    }\n\n    lines = [\"【本卦】\" + ben_gua[\"name\"]]\n   \
          \ if dong:\n        lines[0] += \"  之  【变卦】\" + bian_gua[\"name\"]\n   \
          \ else:\n        lines.append(\"【变卦】无动爻，六爻皆静\")\n\n    for i in range(6):\n\
          \        mark = \"  <动>\" if (i + 1) in dong else \"\"\n        lines.append(\"\
          %s：%s%s\" % (YAO[i], \"阳\" if ben[i] else \"阴\", mark))\n\n    return {\n\
          \        \"board\": json.dumps(board, ensure_ascii=False),\n        \"board_text\"\
          : \"\\n\".join(lines),\n    }"
