          \n        return {\"topic\": \"\"}\n\n    for k in MARRIAGE:\n        if\
          \ k in q:\n            topic = \"marriage\"\n            break\n\n    if\
          \ not topic:\n        for k in MATTER:\n            if k in q:\n       \
          \         topic = \"matter\"\n                break\n\n    if not topic:\n\
