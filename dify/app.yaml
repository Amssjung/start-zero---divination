          , \"土\", \"金\", \"火\", \"水\", \"土\", \"金\", \"木\",\n         \"水\", \"土\"\
          , \"火\", \"木\", \"水\", \"金\", \"火\", \"木\", \"土\", \"金\",\n         \"火\"\
          , \"水\", \"土\", \"金\", \"木\", \"水\", \"土\", \"火\", \"木\", \"水\"]\nJU = {\"\
          水\": 2, \"木\": 3, \"金\": 4, \"土\": 5, \"火\": 6}\nJU_NAME = {2: \"水二局\",\
          \ 3: \"木三局\", 4: \"金四局\", 5: \"土五局\", 6: \"火六局\"}\n\nZI_WEI_SERIES = [(\"\
          紫微\", 0), (\"天机\", -1), (\"太阳\", -3),\n                 (\"武曲\", -4), (\"\
          天同\", -5), (\"廉贞\", -8)]\nTIAN_FU_SERIES = [(\"天府\", 0), (\"太阴\", 1), (\"\
          贪狼\", 2), (\"巨门\", 3),\n                  (\"天相\", 4), (\"天梁\", 5), (\"\
          七杀\", 6), (\"破军\", 10)]\nSIHUA = {\n    \"甲\": (\"廉贞\", \"破军\", \"武曲\",\
          \ \"太阳\"),\n    \"乙\": (\"天机\", \"天梁\", \"紫微\", \"太阴\"),\n    \"丙\": (\"\
          天同\", \"天机\", \"文昌\", \"廉贞\"),\n    \"丁\": (\"太阴\", \"天同\", \"天机\", \"巨门\"\
          ),\n    \"戊\": (\"贪狼\", \"太阴\", \"右弼\", \"天机\"),\n    \"己\": (\"武曲\", \"\
          贪狼\", \"天梁\", \"文曲\"),\n    \"庚\": (\"太阳\", \"武曲\", \"太阴\", \"天同\"),\n \
          \   \"辛\": (\"巨门\", \"太阳\", \"文曲\", \"文昌\"),\n    \"壬\": (\"天梁\", \"紫微\"\
          , \"左辅\", \"武曲\"),\n    \"癸\": (\"破军\", \"巨门\", \"太阴\", \"贪狼\"),\n}\n\n\n\
          def ganzhi_index(g, z):\n    for n in range(60):\n        if n % 10 == g\
          \ and n % 12 == z:\n            return n\n    return 0\n\n\ndef ziwei_branch(ju,\
          \ day):\n    borrow = (ju - day % ju) % ju\n    quotient = ((day + borrow)\
          \ // ju) % 12\n    base = quotient - 1\n    steps = base + borrow if borrow\
          \ % 2 == 0 else base - borrow\n    return (2 + steps) % 12\n\n\ndef tianfu_branch(zi):\n\
          \    return (2 - (zi - 2)) % 12\n\n\ndef place_major(ju, day):\n    zi =\
          \ ziwei_branch(ju, day)\n    fu = tianfu_branch(zi)\n    result = {}\n \
          \   for name, off in ZI_WEI_SERIES:\n        result.setdefault((zi + off)\
          \ % 12, []).append(name)\n    for name, off in TIAN_FU_SERIES:\n       \
          \ result.setdefault((fu + off) % 12, []).append(name)\n    return result,\
          \ zi, fu\n\ndef to_int(v, default=0):\n    try:\n        return int(v)\n\
          \    except Exception:\n        pass\n    try:\n        return int(float(v))\n\
          \    except Exception:\n        pass\n    if isinstance(v, str):\n     \
          \   CN = {\"一\": 1, \"二\": 2, \"三\": 3, \"四\": 4, \"五\": 5,\n          \
          \    \"六\": 6, \"七\": 7, \"八\": 8, \"九\": 9, \"十\": 10,\n              \"\
          十一\": 11, \"十二\": 12}\n        return CN.get(v.strip(), default)\n    return\
          \ default\n\ndef main(lunar_year=0, lunar_month=0, lunar_day=0, hour_index=0,\n\
          \         gender=\"\", topic=\"\", query=\"\"):\n    y = to_int(lunar_year)\n\
          \    m = to_int(lunar_month)\n    d = to_int(lunar_day)\n    h = to_int(hour_index)\n\
          \n    topic = str(topic or \"\").strip()\n    if topic not in (\"marriage\"\
          , \"matter\", \"fortune\", \"growth\", \"choice\"):\n        topic = \"\"\
          \n\n    if y <= 0 or m <= 0 or d <= 0:\n        return {\n            \"\
