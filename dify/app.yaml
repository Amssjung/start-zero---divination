        code: "import json\n\nGAN = \"甲乙丙丁戊己庚辛壬癸\"\nZHI = \"子丑寅卯辰巳午未申酉戌亥\"\nPALACES\
          \ = [\"命宫\", \"兄弟\", \"夫妻\", \"子女\", \"财帛\", \"疾厄\",\n           \"迁移\"\
