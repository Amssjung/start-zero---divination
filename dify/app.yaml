    - data:
        classes:
        - id: '1'
          label: CLASS 1
          name: '用户明确要用生辰八字、四柱、命理来测算。

            典型说法：「用八字看看」「帮我排个盘」「按生辰算一下」，或直接给出出生年月日时并要求算命。

            注意：只提到生日但没有说要算命，不算这一类。'
        - id: '2'
          label: CLASS 2
          name: '用户明确要用塔罗牌测算。

            典型说法：「用塔罗看看」「抽张牌」「塔罗牌阵」。

            注意：只说「帮我算算」但没提塔罗，不算这一类。'
        - id: ffc55612-c321-44c5-bca0-65997b2ce908
          label: CLASS 3
          name: '用户明确要用六爻起卦。

            典型说法：「摇一卦」「用六爻」「起个卦看看」「卜一卦」。'
        - id: 8f3c4658-27d0-40e1-a2f6-3135e7b88c81
          label: CLASS 6
          name: '用户要查某一天的日子好不好，或问某个日期适合做什么。

            典型说法：「看看明天」「11 月 8 号适合签约吗」「这周哪天好」「黄历」。'
        - id: cbee4e1f-4f78-486c-afe9-6b52b929eba7
          label: CLASS 7
          name: '用户用星座、太阳星座、星盘来问自己或他人的性格与运势。

            典型说法：「看看我的星座」「我是什么星座」「星座运势」。

            注意：只问运势但没提星座，不算这一类。'
        - id: 0a6c7fc5-19ca-4c68-b257-635f38db46b9
          label: CLASS 8
          name: '用户要用紫微斗数看盘。

            典型说法：「用紫微看看」「排个紫微盘」「看我的命宫」。

            注意：只问命理但没提紫微，不算这一类。'
        - id: cdd6e1a1-879c-47a6-b658-28f312f606cf
          label: CLASS 4
          name: '用户针对已经得到的占卜结果继续提问，没有要求换方法或重新起盘。

            典型说法：「那下个月呢」「为什么会这样」「具体指什么」「那我该怎么办」。

            注意：只有当前已经有过占卜结果时才属于这一类。'
        - id: d60723b2-9d7a-42b5-b626-65cb0311267c
          label: CLASS 5
          name: '不适合以上任何一类的情况，包括：

            - 打招呼、寒暄：「你好」「在吗」

            - 咨询用法：「你能做什么」「怎么用」

            - 想占卜但没说方法：「帮我算算感情」「看看我最近运势」'
