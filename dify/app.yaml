    - data:
        code: "\nimport json\nimport random\nimport time\n\nMAJOR = [\"愚者\", \"魔术师\"\
          , \"女祭司\", \"女皇\", \"皇帝\", \"教皇\", \"恋人\", \"战车\",\n         \"力量\", \"\
          隐士\", \"命运之轮\", \"正义\", \"倒吊人\", \"死神\", \"节制\", \"恶魔\",\n         \"高塔\"\
          , \"星星\", \"月亮\", \"太阳\", \"审判\", \"世界\"]\n\nSUITS = [\"权杖\", \"圣杯\", \"\
          宝剑\", \"星币\"]\nRANKS = [\"Ace\", \"2\", \"3\", \"4\", \"5\", \"6\", \"7\"\
          , \"8\", \"9\", \"10\", \"侍从\", \"骑士\", \"王后\", \"国王\"]\n\nPOSITIONS = [\"\
          过去\", \"现在\", \"未来\"]\n\n\ndef build_deck():\n    deck = [{\"card\": c,\
          \ \"arcana\": \"major\"} for c in MAJOR]\n    for s in SUITS:\n        for\
          \ r in RANKS:\n            deck.append({\"card\": s + r, \"arcana\": \"\
          minor\"})\n    return deck\n\n\ndef main(query: str, topic = '') -> dict:\n\
          \    seed = int(time.time() * 1000)\n    rng = random.Random(seed)\n\n \
          \   deck = build_deck()\n    rng.shuffle(deck)\n\n    cards = []\n    for\
          \ i, pos in enumerate(POSITIONS):\n        c = deck[i]\n        cards.append({\n\
          \            \"pos\": pos,\n            \"card\": c[\"card\"],\n       \
          \     \"arcana\": c[\"arcana\"],\n            \"orientation\": rng.choice([\"\
          upright\", \"reversed\"]),\n        })\n\n    board = {\n        \"method\"\
          : \"tarot\",\n        \"topic\": topic or \"\",\n        \"question\": query\
          \ or \"\",\n        \"spread\": {\"id\": \"three_card\", \"name\": \"三牌阵\"\
          , \"positions\": POSITIONS},\n        \"cards\": cards,\n        \"seed\"\
          : seed,\n    }\n\n    lines = [\"【牌阵】三牌阵（过去 / 现在 / 未来）\"]\n    for c in\
          \ cards:\n        ori = \"正位\" if c[\"orientation\"] == \"upright\" else\
