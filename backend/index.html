<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卦算 · 数据台</title>
<style>
  :root {
    --ink: #0e0f12;
    --panel: #171a21;
    --line: #2a2f3a;
    --gold: #c9a227;
    --gold-lit: #e8c65a;
    --text: #e8e6e0;
    --muted: #8d8778;
    --ok: #4caf7d;
    --bad: #e05c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 16px 48px;
    color: var(--text);
    font: 15px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2029, var(--ink)) fixed;
  }
  .wrap { width: 100%; max-width: 1160px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  .trigram { color: var(--gold); letter-spacing: .5em; font-size: 18px; }
  h1 { margin: 6px 0 4px; font-size: 26px; letter-spacing: .12em; font-weight: 600; }
  h1 span { color: var(--gold); }
  .sub { color: var(--muted); font-size: 13px; letter-spacing: .06em; }

  .layout {
    display: grid;
    grid-template-columns: minmax(260px, .85fr) minmax(0, 1.4fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 24px 60px -34px #000;
  }
  h2 {
    margin: 0 0 14px;
    font-size: 16px;
    letter-spacing: .12em;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  h2::before {
    content: "";
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: linear-gradient(var(--gold-lit), var(--gold));
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .1em;
    margin: 12px 0 6px;
  }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #10131a;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: .18s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,162,39,.12);
  }
  select { cursor: pointer; }
  textarea { min-height: 86px; resize: vertical; line-height: 1.6; }
  .row { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; gap: 0; } }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }

  button {
    padding: 11px 18px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #10131a;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    letter-spacing: .08em;
    cursor: pointer;
    transition: .18s;
  }
  button:hover { border-color: var(--gold); color: var(--gold-lit); }
  button.primary {
    width: 100%;
    margin-top: 18px;
    background: linear-gradient(160deg, var(--gold-lit), var(--gold));
    border-color: var(--gold);
    color: #191611;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.06); color: #191611; }
  button:disabled { opacity: .55; cursor: not-allowed; }

  #msg { min-height: 22px; margin: 4px 0 10px; font-size: 13px; }
  #msg.ok { color: var(--ok); }
  #msg.bad { color: var(--bad); }

  .history-card { margin-top: 18px; }
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .history-head h2 { margin: 0 0 6px; }
  .count { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: .05em; }
  .search { display: flex; gap: 8px; }
  .search input { width: 220px; }
  .search button { flex: 0 0 auto; }
  @media (max-width: 560px) {
    .search { width: 100%; }
    .search input { flex: 1; width: auto; }
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 740px; }
  thead th {
    padding: 10px 12px;
    text-align: left;
    white-space: nowrap;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: .08em;
    background: #10131a;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid #20242d;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #1b1f27; }
  td.result { max-width: 300px; color: #b9d8c4; font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0 !important; white-space: normal; }
  footer { text-align: center; color: #57534a; font-size: 12px; margin-top: 20px; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="trigram">☰ ☱ ☲ ☳ ☴ ☵ ☶ ☷</div>
    <h1>卦算<span>·</span>数据台</h1>
    <div class="sub">用户数据与占卜历史 · 写入 MySQL</div>
  </header>

  <main class="layout">
    <section class="card">
      <h2>写入用户</h2>
      <form id="user-form">
        <label for="user-name">用户名</label>
        <input id="user-name" maxlength="100" placeholder="例如：张三" autocomplete="off" required>
        <p class="hint">用户名已存在时返回原来的 user_id，不会重复插入。</p>
        <button class="primary" type="submit">写入用户</button>
      </form>
    </section>

    <section class="card">
      <h2>写入卦例</h2>
      <form id="history-form">
        <div class="row">
          <div>
            <label for="history-name">用户名</label>
            <input id="history-name" maxlength="100" placeholder="不存在会自动创建" autocomplete="off" required>
          </div>
          <div>
            <label for="method">起卦方式</label>
            <select id="method">
              <option value="liuyao">六爻</option>
              <option value="meihua">梅花易数</option>
              <option value="tarot">塔罗</option>
            </select>
          </div>
        </div>
        <label for="question">所问之事</label>
        <input id="question" maxlength="500" placeholder="例如：今年事业如何" required>
        <label for="hexagram">卦名</label>
        <input id="hexagram" maxlength="100" placeholder="例如：水火既济 → 风山渐">
        <label for="result">结果</label>
        <textarea id="result" placeholder="可留空，也可以写动爻、纳甲等"></textarea>
        <button class="primary" type="submit">写入卦例</button>
      </form>
    </section>
  </main>

  <section class="card history-card">
    <div class="history-head">
      <h2>历史记录 <span class="count" id="count"></span></h2>
      <form class="search" id="search-form">
        <input id="search-name" placeholder="按用户名筛选，留空看全部">
        <button type="submit">查询</button>
      </form>
    </div>

    <div id="msg"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>用户</th>
            <th>所问</th>
            <th>方式</th>
            <th>卦名</th>
            <th>结果</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr><td class="empty" colspan="6">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <footer>POST /api/users · POST /api/history · GET /api/history · 数据来自 MySQL</footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const METHOD_NAMES = { liuyao: "六爻", meihua: "梅花", tarot: "塔罗" };

  function setMsg(text, kind) {
    const el = $("msg");
    el.textContent = text;
    el.className = kind || "";
  }

  async function request(path, options) {
    const res = await fetch(path, options);
    const payload = await res.json().catch(() => ({}));
    if (!res.ok || payload.ok === false) {
      throw new Error(payload.error || ("HTTP " + res.status));
    }
    return payload;
  }

  function postJSON(path, data) {
    return request(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
  }

  function emptyRow(text) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 6;
    td.className = "empty";
    td.textContent = text;
    tr.appendChild(td);
    return tr;
  }

  async function loadHistory() {
    const username = $("search-name").value.trim();
    const url = username
      ? "/api/history?username=" + encodeURIComponent(username)
      : "/api/history";
    const tbody = $("history-body");

    try {
      const payload = await request(url);
      const rows = payload.data || [];
      $("count").textContent = rows.length ? rows.length + " 条" : "";
      tbody.innerHTML = "";

      if (rows.length === 0) {
        tbody.appendChild(emptyRow("暂无记录"));
        return;
      }

      for (const row of rows) {
        const tr = document.createElement("tr");
        const cells = [
          row.created_at,
          row.username,
          row.question,
          METHOD_NAMES[row.method] || row.method,
          row.hexagram,
          row.result,
        ];

        cells.forEach((value, index) => {
          const td = document.createElement("td");
          td.textContent = value || "—";
          if (index === 5) td.className = "result";
          if (value && String(value).length > 30) td.title = value;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
    } catch (err) {
      $("count").textContent = "";
      tbody.innerHTML = "";
      tbody.appendChild(emptyRow("查询失败：" + err.message));
    }
  }

  $("user-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const username = $("user-name").value.trim();
    if (!username) return setMsg("请先填用户名", "bad");

    setMsg("写入中…");
    try {
      const payload = await postJSON("/api/users", { username });
      setMsg("用户已写入，user_id = " + payload.user_id, "ok");
      $("user-form").reset();
      loadHistory();
    } catch (err) {
      setMsg("写入失败：" + err.message, "bad");
    }
  });

  $("history-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const data = {
      username: $("history-name").value.trim(),
      question: $("question").value.trim(),
      method: $("method").value,
      hexagram: $("hexagram").value.trim(),
      result: $("result").value.trim(),
    };
    if (!data.username || !data.question) {
      return setMsg("用户名和所问之事都要填", "bad");
    }

    setMsg("写入中…");
    try {
      const payload = await postJSON("/api/history", data);
      setMsg("卦例已写入，record_id = " + payload.record_id + "，user_id = " + payload.user_id, "ok");
      $("history-form").reset();
      loadHistory();
    } catch (err) {
      setMsg("写入失败：" + err.message, "bad");
    }
  });

  $("search-form").addEventListener("submit", (event) => {
    event.preventDefault();
    loadHistory();
  });

  loadHistory();
</script>
</body>
</html>
